<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>비서실</title>
<style>
  :root{
    --bg:#f2f3f6; --card:#ffffff; --ink:#12141a; --muted:#6b7280; --faint:#9aa1ad;
    --line:#e6e8ee; --navy:#171b26; --green:#10b981; --green-soft:#e6f8f0; --green-ink:#0b7a4b;
    --blue:#3563e9; --blue-soft:#eef3ff; --blue-ink:#1e3a8a;
    --red:#e0362f; --red-soft:#fdeeed; --red-ink:#8d1f19;
    --yellow:#a86a00; --yellow-soft:#fff6e0; --yellow-ink:#7a4d00;
    --gray-soft:#f3f4f7; --gray-ink:#3f4552;
    --chip:#eef0f4; --chip-ink:#4b5262; --tabs-bg:#e9ebf0; --tab-on:#ffffff; --tab-ink:#5d6472;
    --tabbar-bg:rgba(242,243,246,.86); --th-bg:#fafbfc; --input-bg:#fafbfc;
    --code-bg:#f1f2f6; --code-ink:#3b4252; --ck-border:#cfd5df; --arrow:#a6adba; --dot:#c3c9d4;
    --lock-glow1:#ffffff; --lock-glow2:#e6ecff;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --radius:22px;
  }
  html[data-theme="dark"]{
    --bg:#0d1117; --card:#151a22; --ink:#e9ecf2; --muted:#a3adbb; --faint:#7c8797;
    --line:#242b36; --navy:#232a35; --green:#34d399; --green-soft:#123023; --green-ink:#6ee7b7;
    --blue:#8cb0ff; --blue-soft:#141d33; --blue-ink:#b9cbff;
    --red:#ff6b63; --red-soft:#2a1518; --red-ink:#ffb3ad;
    --yellow:#f0c05a; --yellow-soft:#2a2214; --yellow-ink:#f6cf7d;
    --gray-soft:#1b2029; --gray-ink:#c9cfda;
    --chip:#1e2530; --chip-ink:#c9d2e0; --tabs-bg:#1a2029; --tab-on:#2b3341; --tab-ink:#a7b1c0;
    --tabbar-bg:rgba(13,17,23,.86); --th-bg:#1a1f28; --input-bg:#12171f;
    --code-bg:#1e2530; --code-ink:#c7d0de; --ck-border:#39424f; --arrow:#6b7686; --dot:#3a4250;
    --lock-glow1:#1b2433; --lock-glow2:#101826;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
    word-break:keep-all; overflow-wrap:break-word;
  }
  button{font:inherit;color:inherit}
  a{color:var(--blue);text-decoration:none}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace;font-size:.88em;background:var(--code-bg);border-radius:6px;padding:1px 5px;color:var(--code-ink)}
  b,strong{font-weight:700}
  mark{background:rgba(255,206,0,.42);color:inherit;border-radius:4px;padding:0 2px}
  html[data-theme="dark"] mark{background:rgba(255,214,0,.26)}

  /* ---------- lock ---------- */
  #lock{
    min-height:100dvh; display:grid; place-items:center; padding:24px 20px;
    background:
      radial-gradient(900px 480px at 50% -8%, var(--lock-glow1) 0%, rgba(255,255,255,0) 70%),
      radial-gradient(520px 320px at 110% 110%, var(--lock-glow2) 0%, rgba(230,236,255,0) 70%),
      var(--bg);
  }
  .lock-card{
    width:min(430px,100%); background:var(--card); border:1px solid var(--line);
    border-radius:30px; padding:30px 26px 26px; box-shadow:var(--shadow);
    animation:rise .5s cubic-bezier(.2,.7,.3,1) both;
  }
  .lock-mark{
    width:66px;height:66px;border-radius:22px;background:var(--navy);color:#fff;
    display:grid;place-items:center;font-size:30px;line-height:1;
    box-shadow:0 10px 24px rgba(23,27,38,.25);margin-bottom:18px;
  }
  .lock-title{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}
  .lock-sub{margin:6px 0 22px;color:var(--muted);font-size:14px}
  .field{position:relative}
  .field input{
    width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:16px;
    background:var(--input-bg);color:var(--ink);font-size:16px;letter-spacing:.08em;outline:none;transition:.18s;
  }
  .field input:focus{border-color:var(--ck-border);background:var(--card);box-shadow:0 0 0 4px rgba(53,99,233,.08)}
  .btn-primary{
    width:100%;margin-top:12px;padding:15px 16px;border:0;border-radius:16px;
    background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer;
    transition:transform .12s,opacity .2s;
  }
  .btn-primary:active{transform:scale(.99)}
  .btn-primary[disabled]{opacity:.6;cursor:progress}
  .lock-msg{min-height:20px;margin:12px 2px 0;font-size:13px;color:var(--red)}
  .lock-note{margin:18px 2px 0;font-size:12px;color:var(--faint);line-height:1.6}
  .shake{animation:shake .34s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- shell ---------- */
  #app[hidden], #lock[hidden]{display:none!important}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 56px}
  .topbar{display:flex;align-items:center;gap:12px;padding:6px 2px 16px}
  .mark{
    width:56px;height:56px;flex:0 0 56px;border-radius:18px;background:var(--navy);color:#fff;
    display:grid;place-items:center;font-size:26px;box-shadow:0 8px 18px rgba(23,27,38,.22)
  }
  .titles{min-width:0;flex:1}
  .titles h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titles p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .icon-btn{
    width:42px;height:42px;flex:0 0 42px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;
    box-shadow:var(--shadow);transition:transform .12s,border-color .15s;
  }
  .icon-btn:active{transform:scale(.96)}
  .live{
    display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
    background:var(--green-soft);color:var(--green-ink);font-size:12px;font-weight:800;letter-spacing:.06em;flex:0 0 auto
  }
  .live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(16,185,129,.55);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 9px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

  .tabbar{
    position:sticky;top:0;z-index:40;margin:0 -16px 18px;padding:10px 16px 12px;
    background:var(--tabbar-bg);backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
  }
  .tabs{
    display:flex;gap:4px;background:var(--tabs-bg);border-radius:18px;padding:5px;
    overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:1 0 auto;min-width:0;border:0;background:transparent;border-radius:14px;
    padding:11px 14px;font-size:14px;font-weight:700;color:var(--tab-ink);cursor:pointer;
    white-space:nowrap;transition:background .16s,color .16s,box-shadow .16s
  }
  .tab[aria-selected="true"]{background:var(--tab-on);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08),0 4px 12px rgba(16,24,40,.07)}
  .search-wrap{
    position:relative;display:flex;align-items:center;gap:8px;margin-top:9px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;
    box-shadow:var(--shadow);
  }
  .search-wrap .s-ico{font-size:14px;line-height:1;opacity:.75;flex:0 0 auto}
  .search-wrap input{
    flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;
    font-size:14px;outline:none;padding:2px 0;letter-spacing:-.01em;
  }
  .search-wrap input::placeholder{color:var(--faint)}
  .search-wrap input::-webkit-search-cancel-button{display:none}
  .s-clear{
    flex:0 0 auto;border:0;background:var(--chip);color:var(--chip-ink);border-radius:999px;
    width:24px;height:24px;font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;
  }
  .s-clear[hidden]{display:none}

  /* ---------- cards & blocks ---------- */
  .panel[hidden]{display:none}
  .panel{animation:fade .32s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
  .hero{padding:22px}
  .badge{display:inline-block;padding:6px 11px;border-radius:9px;background:var(--chip);color:var(--chip-ink);font-size:12px;font-weight:800}
  .hero h2{margin:12px 0 6px;font-size:21px;line-height:1.35;font-weight:800;letter-spacing:-.03em}
  .hero p{margin:0;color:var(--muted);font-size:14px}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .pill{padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--chip-ink);box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .pill.solid{background:var(--navy);color:#fff;border-color:var(--navy)}

  .sec{display:flex;align-items:baseline;gap:10px;margin:26px 4px 12px;flex-wrap:wrap;border-radius:16px}
  .sec:first-child{margin-top:4px}
  .sec h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.03em}
  .sec p{margin:0;font-size:13px;color:var(--faint)}

  .parts{display:grid;grid-template-columns:1fr;gap:12px}
  .part{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);scroll-margin-top:150px}
  .part-head{display:flex;align-items:center;gap:11px}
  .part-emoji{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-size:21px}
  .part-name{font-size:16px;font-weight:800;letter-spacing:-.02em}
  .part-cycle{font-size:12px;color:var(--faint);white-space:nowrap}
  .state{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--green-soft);color:var(--green-ink);white-space:nowrap}
  .state i{width:6px;height:6px;border-radius:50%;background:var(--green)}
  .part-doing{margin:13px 0 0;font-size:14.5px;font-weight:700}
  .part-meta{margin:8px 0 0;font-size:13px;color:var(--muted)}
  .part-last{margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--faint)}

  .callout{border-radius:20px;padding:18px 18px 16px;margin-bottom:12px;border:1px solid transparent;box-shadow:var(--shadow)}
  .callout .co-title{display:flex;align-items:baseline;flex-wrap:wrap;gap:9px;font-size:15px;font-weight:800;line-height:1.45;letter-spacing:-.02em}
  .callout .co-title span.ico{font-size:17px;line-height:1.4}
  .callout .co-title .tt{flex:1 1 auto;min-width:0}
  .callout .co-body{margin:9px 0 0 27px;font-size:13.5px;line-height:1.62}
  .callout .co-body ul{margin:0;padding-left:16px}
  .callout .co-body li{margin:3px 0}
  .red{background:var(--red-soft);border-color:rgba(224,54,47,.22);color:var(--red-ink)}
  .yellow{background:var(--yellow-soft);border-color:rgba(168,106,0,.22);color:var(--yellow-ink)}
  .blue{background:var(--blue-soft);border-color:rgba(53,99,233,.2);color:var(--blue-ink)}
  .gray{background:var(--gray-soft);border-color:var(--line);color:var(--gray-ink)}

  .table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;scroll-margin-top:150px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:460px}
  th,td{text-align:left;vertical-align:top;padding:13px 16px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--faint);font-weight:800;background:var(--th-bg);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td:first-child{font-weight:700;white-space:nowrap}

  .acc{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;scroll-margin-top:150px}
  .acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:16px 18px;font-size:14.5px;font-weight:800;letter-spacing:-.02em}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary:after{content:"";width:8px;height:8px;margin-left:auto;border-right:2px solid var(--arrow);border-bottom:2px solid var(--arrow);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
  .acc[open] summary:after{transform:rotate(-135deg) translateY(-2px)}
  .acc-body{padding:0 18px 16px;font-size:13.5px;color:var(--gray-ink);line-height:1.68}
  .acc-body ul{margin:0;padding-left:18px}
  .acc-body li{margin:5px 0}
  .acc-body ul ul{margin:4px 0}

  .office{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:10px;position:relative;overflow:hidden;scroll-margin-top:150px}
  .office-img{display:block;width:100%;height:auto;border-radius:18px;background:var(--chip)}
  .spot{
    position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;
    padding:7px 12px;border-radius:999px;background:rgba(22,26,36,.86);color:#fff;
    font-size:12px;font-weight:800;letter-spacing:-.01em;cursor:pointer;border:0;
    box-shadow:0 6px 16px rgba(16,24,40,.28);backdrop-filter:blur(4px);white-space:nowrap;
    transition:transform .15s,background .15s
  }
  .spot:hover{transform:translate(-50%,-50%) scale(1.06);background:#0f131c}
  .spot i{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.25)}
  .office-cap{margin:10px 6px 2px;font-size:12px;color:var(--faint)}

  .list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 18px;margin-bottom:12px;scroll-margin-top:150px}
  .list ul{margin:0;padding:0;list-style:none}
  .list li{position:relative;padding:12px 0 12px 18px;font-size:13.5px;border-bottom:1px solid var(--line);line-height:1.6;scroll-margin-top:150px;border-radius:10px}
  .list li:last-child{border-bottom:0}
  .list li:before{content:"";position:absolute;left:2px;top:20px;width:6px;height:6px;border-radius:50%;background:var(--dot)}

  .timeline{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 18px;margin-bottom:12px;scroll-margin-top:150px}
  .tl{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);scroll-margin-top:150px;border-radius:10px}
  .tl:last-child{border-bottom:0}
  .tl-date{flex:0 0 118px;font-size:12.5px;font-weight:800;color:var(--gray-ink);font-variant-numeric:tabular-nums;line-height:1.5}
  .tl-text{font-size:13.5px;line-height:1.6;min-width:0}
  .tl-tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue-ink);font-size:11px;font-weight:800;vertical-align:1px}

  .dday{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:11px;font-weight:800;letter-spacing:-.01em;vertical-align:1px;white-space:nowrap}
  .tl-date .dday{margin-top:5px}
  .dday.soon{background:var(--red-soft);color:var(--red-ink)}
  .dday.now{background:var(--red);color:#fff}
  .dday.past{background:var(--chip);color:var(--faint)}

  .checks{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 18px 4px;margin-bottom:12px;scroll-margin-top:150px}
  .ck-head{display:flex;align-items:center;gap:9px;padding:13px 0 11px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:700}
  .ck-count{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .bar{flex:1;min-width:50px;height:8px;border-radius:999px;background:var(--chip);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .25s ease}
  .ck-reset{border:0;background:transparent;color:var(--faint);font-size:12px;font-weight:700;cursor:pointer;padding:4px 2px}
  .check{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;line-height:1.6;border-radius:10px;scroll-margin-top:150px}
  .check:last-child{border-bottom:0}
  .check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:0 0 22px;margin:0;border:1.5px solid var(--ck-border);border-radius:7px;background:var(--card);cursor:pointer;position:relative;transition:.15s}
  .check input:checked{background:var(--green);border-color:var(--green)}
  .check input:checked:after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .check input:checked + span{color:var(--faint);text-decoration:line-through}

  .memo{scroll-margin-top:150px}
  .memo-title{margin:0 0 4px;font-size:15px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .memo-hint{margin:0 0 10px;font-size:12.5px;color:var(--faint)}
  .memo textarea{
    width:100%;min-height:132px;resize:vertical;display:block;
    border:1.5px solid var(--line);border-radius:14px;background:var(--input-bg);color:var(--ink);
    padding:12px 14px;font:inherit;font-size:14px;line-height:1.65;outline:none;transition:.16s;
  }
  .memo textarea:focus{border-color:var(--ck-border);background:var(--card);box-shadow:0 0 0 4px rgba(53,99,233,.08)}
  .memo textarea::placeholder{color:var(--faint)}
  .memo-foot{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--faint)}
  .memo-foot .spacer{flex:1}

  .search-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 18px;margin-bottom:14px}
  .search-panel[hidden]{display:none}
  .sr-head{padding:10px 0 8px;font-size:12px;font-weight:800;color:var(--faint);border-bottom:1px solid var(--line)}
  .sr-item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer;border-radius:10px}
  .sr-item:last-child{border-bottom:0}
  .sr-tab{display:inline-block;font-size:11px;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:2px 8px;margin-right:7px;vertical-align:1px}
  .sr-title{font-size:14px;font-weight:700;color:var(--ink)}
  .sr-text{display:block;margin-top:4px;font-size:12.5px;color:var(--muted);line-height:1.55}
  .sr-empty{padding:22px 0;font-size:13.5px;color:var(--muted);text-align:center}

  .links{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
  .link{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;font-size:14px;font-weight:700;color:var(--ink);
    box-shadow:var(--shadow);transition:transform .12s,border-color .15s;scroll-margin-top:150px
  }
  .link:hover{border-color:var(--ck-border)}
  .link:active{transform:scale(.995)}
  .link:after{content:"↗";margin-left:auto;color:var(--faint);font-weight:400}

  .foot{margin:26px 2px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
  .foot .spacer{flex:1}
  .btn-ghost{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--chip-ink);cursor:pointer}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--dot)}
  .flash{animation:flash 1.4s ease;border-radius:16px}
  @keyframes flash{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 3px rgba(53,99,233,.35),0 8px 24px rgba(53,99,233,.14)}}

  @media (min-width:720px){
    .wrap{padding:30px 24px 64px}
    .mark{width:62px;height:62px;flex-basis:62px;border-radius:20px;font-size:29px}
    .titles h1{font-size:26px}
    .tabbar{margin:0 -24px 22px;padding:12px 24px 14px}
    .tab{padding:12px 18px;font-size:14.5px}
    .parts{grid-template-columns:repeat(2,1fr)}
    .parts > .part:last-child:nth-child(odd){grid-column:span 2}
    .links{grid-template-columns:repeat(2,1fr)}
    .hero h2{font-size:24px}
    .card{padding:24px}
    .part{padding:20px}
  }
  @media (min-width:1000px){
    .parts{grid-template-columns:repeat(3,1fr)}
    .parts > .part:last-child:nth-child(3n+2){grid-column:span 2}
    .hero h2{font-size:26px}
  }
  @media (max-width:520px){
    .search-wrap input,.memo textarea{font-size:16px}
    .spot{font-size:11px;padding:6px 9px;gap:4px}
    .spot i{width:5px;height:5px}
    .titles h1{font-size:20px}
    .live{padding:7px 10px;font-size:11px}
    .icon-btn{width:38px;height:38px;flex-basis:38px;border-radius:12px;font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

<script>
(function(){
  "use strict";
  var SKEY = "office-unlocked-v1";
  var AUTO_LOCK_MS = 30 * 60 * 1000;
  var THEME_KEY = "office.theme.v1";
  var CK_PREFIX = "office.checks.v2.";
  var MEMO_PREFIX = "office.memo.v2.";
  var payload = JSON.parse(document.getElementById("payload").textContent);
  var lockEl = document.getElementById("lock");
  var appEl = document.getElementById("app");
  var wrapEl = document.getElementById("wrap");
  var form = document.getElementById("lock-form");
  var pwEl = document.getElementById("pw");
  var msgEl = document.getElementById("msg");
  var btn = document.getElementById("unlock-btn");
  var tries = 0, autoLockTimer = null;
  var IDX = [], TABLABEL = {}, theme = "light", memoKey = "memo", memoStatusTimer = null;

  /* ---------------- storage ---------------- */
  var LS = {
    get: function(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
    set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
    del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
  };

  function b64(s){
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function deriveKey(password){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(payload.salt), iterations: payload.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      });
  }
  function decrypt(password){
    return deriveKey(password).then(function(key){
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(payload.iv) }, key, b64(payload.ct));
    }).then(function(buf){
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }

  /* ---------------- theme ---------------- */
  function applyTheme(t, persist){
    theme = (t === "dark") ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", theme);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", theme === "dark" ? "#0d1117" : "#f4f5f7");
    var b = document.getElementById("theme-btn");
    if (b) {
      b.textContent = theme === "dark" ? "☀️" : "🌙";
      b.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      b.setAttribute("aria-label", theme === "dark" ? "라이트 모드로 전환" : "다크 모드로 전환");
    }
    if (persist) LS.set(THEME_KEY, theme);
  }
  var savedTheme = LS.get(THEME_KEY, null);
  applyTheme(savedTheme || ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"), false);

  /* ---------------- helpers ---------------- */
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function strip(h){
    return String(h == null ? "" : h).replace(/<[^>]*>/g, " ")
      .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/\s+/g, " ").trim();
  }
  function hkey(t){
    var h = 2166136261, s = String(t);
    for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h.toString(36);
  }
  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function nowHM(){ var d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  function anc(tab, bi, extra){ return "b-" + tab + "-" + bi + (extra === undefined ? "" : "-" + extra); }
  function reg(tab, id, title, text){
    IDX.push({ tab: tab, id: id, title: strip(title), text: strip(title) + " " + strip(text) });
  }
  function ddayHTML(target){
    if (!target) return "";
    var p = String(target).split("-");
    var t = new Date(+p[0], (+p[1]) - 1, +p[2]);
    if (isNaN(t.getTime())) return "";
    var n = new Date();
    var today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    var d = Math.round((t - today) / 86400000);
    var label = d === 0 ? "D-Day" : (d > 0 ? "D-" + d : "D+" + (-d));
    var cls = d === 0 ? " now" : (d > 0 && d <= 3 ? " soon" : (d < 0 ? " past" : ""));
    return '<span class="dday' + cls + '">' + label + '</span>';
  }

  /* ---------------- blocks ---------------- */
  function blockHTML(b, tab, bi){
    var id = anc(tab, bi);
    switch (b.type) {
      case "section":
        reg(tab, id, b.title, b.desc || "");
        return '<div class="sec" id="' + id + '"><h2>' + b.title + '</h2>' + (b.desc ? '<p>' + b.desc + '</p>' : '') + '</div>';
      case "parts":
        return '<div class="parts">' + b.items.map(function(p, i){
          var pid = "part-" + i;
          reg(tab, pid, p.emoji + " " + p.name, p.doing + " " + p.scope + " " + p.cycle + " " + p.last + " " + (p.note || ""));
          return '<article class="part" id="' + pid + '">' +
            '<div class="part-head">' +
              '<div class="part-emoji">' + p.emoji + '</div>' +
              '<div><div class="part-name">' + p.name + '</div><div class="part-cycle">' + p.cycle + '</div></div>' +
              '<span class="state"><i></i>' + p.state + '</span>' +
            '</div>' +
            '<p class="part-doing">' + p.doing + '</p>' +
            '<p class="part-meta">' + p.scope + '</p>' +
            '<p class="part-last">' + p.last + (p.note ? ' · ' + p.note : '') + '</p>' +
          '</article>';
        }).join('') + '</div>';
      case "table":
        reg(tab, id, b.head.join(" · "), b.rows.map(function(r){ return r.join(" "); }).join(" "));
        return '<div class="table-wrap" id="' + id + '"><table><thead><tr>' +
          b.head.map(function(h){ return '<th>' + h + '</th>'; }).join('') +
          '</tr></thead><tbody>' + b.rows.map(function(r){
            return '<tr>' + r.map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>';
      case "accordion":
        return b.items.map(function(it, i){
          var aid = anc(tab, bi, i);
          reg(tab, aid, it.title, it.html);
          return '<details class="acc"' + (b.open ? ' open' : '') + ' id="' + aid + '"><summary>' + it.title + '</summary><div class="acc-body">' + it.html + '</div></details>';
        }).join('');
      case "office_map":
        reg(tab, id, "오피스 지도", (b.caption || "") + " " + b.spots.map(function(s){ return s.label; }).join(" "));
        return '<div class="office" id="' + id + '"><img class="office-img" src="' + b.image + '" alt="비서실 오피스" loading="lazy" width="1536" height="1024">' +
          b.spots.map(function(s){
            var act = (s.part !== undefined) ? ' data-part="' + s.part + '"' : ' data-goto="' + s.tab + '"';
            return '<button class="spot" style="left:' + s.x + '%;top:' + s.y + '%"' + act + ' type="button">' +
              '<i></i>' + (s.emoji ? s.emoji + ' ' : '') + s.label + '</button>';
          }).join('') + '</div>' + (b.caption ? '<p class="office-cap">' + b.caption + '</p>' : '');
      case "callout":
        reg(tab, id, strip(b.title), b.html);
        return '<div class="callout ' + (b.tone || "gray") + '" id="' + id + '"><div class="co-title"><span class="ico">' + b.icon + '</span><span class="tt">' + b.title + '</span>' + ddayHTML(b.targetDate) + '</div><div class="co-body">' + b.html + '</div></div>';
      case "list":
        return '<div class="list" id="' + id + '"><ul>' + b.items.map(function(t, i){
          var lid = anc(tab, bi, i);
          reg(tab, lid, t, "");
          return '<li id="' + lid + '">' + t + '</li>';
        }).join('') + '</ul></div>';
      case "links":
        return '<div class="links">' + b.items.map(function(l, i){
          var lid = anc(tab, bi, i);
          reg(tab, lid, l.label, "");
          return '<a class="link" id="' + lid + '" href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer">' + l.label + '</a>';
        }).join('') + '</div>';
      case "timeline":
        reg(tab, id, "다가오는 주요 일정", b.items.map(function(t){ return t.date + " " + strip(t.text); }).join(" "));
        return '<div class="timeline" id="' + id + '">' + b.items.map(function(t, i){
          var tid = anc(tab, bi, i);
          return '<div class="tl" id="' + tid + '"><div class="tl-date">' + t.date + '<br>' + ddayHTML(t.targetDate) + '</div><div class="tl-text">' + t.text +
            (t.tag ? '<span class="tl-tag">' + t.tag + '</span>' : '') + '</div></div>';
        }).join('') + '</div>';
      case "checklist":
        var ckKey = b.key || id;
        var body = b.items.map(function(t, i){
          var cid = anc(tab, bi, i);
          reg(tab, cid, t, "");
          return '<label class="check" id="' + cid + '" for="' + cid + '-in"><input type="checkbox" id="' + cid + '-in" data-h="' + hkey(t) + '"><span>' + t + '</span></label>';
        }).join('');
        return '<div class="checks" id="' + id + '" data-ck="' + ckKey + '">' +
          '<div class="ck-head"><span>완료</span><span class="ck-count">0/' + b.items.length + '</span><div class="bar"><i></i></div><button class="ck-reset" type="button">초기화</button></div>' +
          body + '</div>';
      case "quickmemo":
        memoKey = b.key || "memo";
        reg(tab, id, b.title || "빠른 메모", "메모장");
        return '<div class="card memo" id="' + id + '">' +
          '<h3 class="memo-title">📝 ' + (b.title || "빠른 메모") + '</h3>' +
          (b.hint ? '<p class="memo-hint">' + b.hint + '</p>' : '') +
          '<textarea id="memo-box" placeholder="생각나는 대로 적어두세요. 자동으로 저장됩니다." aria-label="빠른 메모"></textarea>' +
          '<div class="memo-foot"><span id="memo-status">자동 저장</span><span class="spacer"></span><span id="memo-count"></span>' +
          '<button class="btn-ghost" id="memo-clear" type="button">지우기</button></div>' +
        '</div>';
      default:
        return '';
    }
  }

  /* ---------------- render ---------------- */
  function render(data){
    IDX = []; TABLABEL = {};
    var h = data.head;
    data.tabs.forEach(function(t){ TABLABEL[t.id] = t.label; });

    var html = '<header class="topbar">' +
      '<div class="mark" aria-hidden="true">' + h.mark + '</div>' +
      '<div class="titles"><h1>' + h.title + '</h1><p>' + h.subtitle + '</p></div>' +
      '<button class="icon-btn" id="theme-btn" type="button" aria-label="다크 모드로 전환" aria-pressed="false">🌙</button>' +
      '<span class="live"><i></i>' + h.live + '</span>' +
      '</header>';

    html += '<div class="tabbar"><div class="tabs" role="tablist">' +
      data.tabs.map(function(t, i){
        return '<button class="tab" role="tab" data-tab="' + t.id + '" aria-selected="' + (i === 0 ? "true" : "false") + '" type="button">' + t.label + '</button>';
      }).join('') + '</div>' +
      '<div class="search-wrap"><span class="s-ico" aria-hidden="true">🔍</span>' +
      '<input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="루틴·일정·프로젝트·메모 검색" aria-label="통합 검색">' +
      '<button class="s-clear" id="q-clear" type="button" aria-label="검색어 지우기" hidden>✕</button></div></div>';

    html += '<div class="search-panel" id="srch" hidden></div>';

    html += '<section class="card hero"><span class="badge">' + h.heroBadge + '</span>' +
      '<h2>' + h.heroTitle + '</h2><p>' + h.heroDesc + '</p>' +
      '<div class="pills">' + h.pills.map(function(p, i){ return '<span class="pill' + (i === 0 ? ' solid' : '') + '">' + p + '</span>'; }).join('') + '</div>' +
      '</section>';

    data.tabs.forEach(function(t, i){
      html += '<div class="panel" id="panel-' + t.id + '" role="tabpanel"' + (i === 0 ? '' : ' hidden') + '>' +
        t.blocks.map(function(b, bi){ return blockHTML(b, t.id, bi); }).join('') + '</div>';
    });

    html += '<footer class="foot"><span>' + (data.meta ? data.meta.source + ' · ' + data.meta.generated + (data.meta.updated ? ' ' + data.meta.updated : '') + ' 기준' : '') + '</span>' +
      '<span class="dot"></span><span>체크·메모·테마는 이 기기에만 저장됩니다.</span>' +
      '<span class="spacer"></span><button class="btn-ghost" id="lock-btn" type="button">🔒 잠그기</button></footer>';

    wrapEl.innerHTML = html;
    applyTheme(theme, false);

    wrapEl.querySelectorAll(".tab").forEach(function(btnEl){
      btnEl.addEventListener("click", function(){ selectTab(btnEl.getAttribute("data-tab")); });
    });

    wrapEl.addEventListener("click", onWrapClick);

    /* checklist: restore + progress */
    wrapEl.querySelectorAll(".checks").forEach(function(box){
      var saved = LS.get(CK_PREFIX + box.getAttribute("data-ck"), {}) || {};
      box.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
        if (saved[cb.getAttribute("data-h")]) cb.checked = true;
      });
      updateProgress(box);
    });

    /* memo */
    var mb = wrapEl.querySelector("#memo-box");
    if (mb) {
      var savedMemo = LS.get(MEMO_PREFIX + memoKey, "");
      mb.value = typeof savedMemo === "string" ? savedMemo : "";
      var st0 = wrapEl.querySelector("#memo-status"), ct0 = wrapEl.querySelector("#memo-count");
      if (st0) st0.textContent = mb.value ? "저장됨" : "자동 저장";
      if (ct0) ct0.textContent = mb.value ? (mb.value.replace(/\s/g, "").length + "자") : "";
      mb.addEventListener("input", function(){ onMemoInput(mb); });
    }

    /* search */
    var qEl = wrapEl.querySelector("#q");
    if (qEl) {
      qEl.addEventListener("input", function(){ doSearch(qEl.value); });
      qEl.addEventListener("keydown", function(ev){ if (ev.key === "Escape"){ qEl.value = ""; doSearch(""); } });
    }
  }

  function onWrapClick(ev){
    var spot = ev.target.closest(".spot");
    if (spot) {
      if (spot.dataset.part !== undefined) {
        var card = wrapEl.querySelector("#part-" + spot.dataset.part);
        if (card) flashTo(card);
      } else if (spot.dataset.goto) {
        selectTab(spot.dataset.goto);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      return;
    }
    if (ev.target.closest("#theme-btn")) {
      applyTheme(theme === "dark" ? "light" : "dark", true);
      return;
    }
    if (ev.target.closest("#lock-btn")) { lockNow(); return; }
    if (ev.target.closest("#q-clear")) {
      var qEl = wrapEl.querySelector("#q");
      if (qEl) { qEl.value = ""; qEl.focus(); }
      doSearch("");
      return;
    }
    var sr = ev.target.closest(".sr-item");
    if (sr) {
      var tab = sr.getAttribute("data-tab"), target = sr.getAttribute("data-target");
      selectTab(tab);
      setTimeout(function(){
        var el = document.getElementById(target);
        if (el) flashTo(el);
      }, 70);
      return;
    }
    var reset = ev.target.closest(".ck-reset");
    if (reset) {
      var box = reset.closest(".checks");
      if (box) {
        LS.del(CK_PREFIX + box.getAttribute("data-ck"));
        box.querySelectorAll('input[type="checkbox"]').forEach(function(cb){ cb.checked = false; });
        updateProgress(box);
      }
      return;
    }
    if (ev.target.closest("#memo-clear")) {
      var box2 = wrapEl.querySelector("#memo-box");
      if (box2 && box2.value && window.confirm("빠른 메모를 모두 지울까요? 지운 내용은 되돌릴 수 없습니다.")) {
        box2.value = "";
        LS.del(MEMO_PREFIX + memoKey);
        syncMemoMeta(box2, true);
      }
    }
  }

  function flashTo(el){
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
    setTimeout(function(){ el.classList.remove("flash"); }, 1600);
  }

  wrapEl.addEventListener("change", function(ev){
    var cb = ev.target;
    if (!cb.matches || !cb.matches('.checks input[type="checkbox"]')) return;
    var box = cb.closest(".checks");
    if (!box) return;
    var obj = {};
    box.querySelectorAll('input[type="checkbox"]').forEach(function(c){
      if (c.checked) obj[c.getAttribute("data-h")] = true;
    });
    LS.set(CK_PREFIX + box.getAttribute("data-ck"), obj);
    updateProgress(box);
  });

  function updateProgress(box){
    var boxes = box.querySelectorAll('input[type="checkbox"]');
    var n = 0;
    boxes.forEach(function(c){ if (c.checked) n++; });
    var cnt = box.querySelector(".ck-count"), bar = box.querySelector(".bar i");
    if (cnt) cnt.textContent = n + "/" + boxes.length;
    if (bar) bar.style.width = (boxes.length ? Math.round(n * 100 / boxes.length) : 0) + "%";
  }

  function syncMemoMeta(mb, saved){
    var st = wrapEl.querySelector("#memo-status"), ct = wrapEl.querySelector("#memo-count");
    if (st) st.textContent = mb.value ? ("저장됨 · " + nowHM()) : "자동 저장";
    if (ct) ct.textContent = mb.value ? (mb.value.replace(/\s/g, "").length + "자") : "";
    if (saved) { /* nothing else */ }
  }

  function onMemoInput(mb){
    var st = wrapEl.querySelector("#memo-status");
    if (st) st.textContent = "저장 중…";
    if (memoStatusTimer) clearTimeout(memoStatusTimer);
    memoStatusTimer = setTimeout(function(){
      LS.set(MEMO_PREFIX + memoKey, mb.value);
      syncMemoMeta(mb, true);
    }, 400);
  }

  /* ---------------- search ---------------- */
  function hl(text, q){
    var t = esc(text);
    try {
      var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      return t.replace(re, "<mark>$1</mark>");
    } catch(e){ return t; }
  }

  function doSearch(raw){
    var q = String(raw || "").trim();
    var panel = wrapEl.querySelector("#srch");
    var clearBtn = wrapEl.querySelector("#q-clear");
    if (clearBtn) clearBtn.hidden = !q;
    if (!panel) return;
    if (!q) {
      panel.hidden = true; panel.innerHTML = "";
      selectTab(currentTab());
      return;
    }
    var lower = q.toLowerCase();
    var results = [];
    IDX.forEach(function(e){
      if (e.text.toLowerCase().indexOf(lower) >= 0) results.push(e);
    });
    var mb = wrapEl.querySelector("#memo-box");
    if (mb && mb.value && mb.value.toLowerCase().indexOf(lower) >= 0) {
      results.unshift({ tab: "memo", id: "memo-box", title: "빠른 메모", text: mb.value });
    }

    wrapEl.querySelector(".hero").style.display = "none";
    wrapEl.querySelectorAll(".panel").forEach(function(p){ p.setAttribute("hidden", ""); });

    var body = results.slice(0, 30).map(function(r){
      var text = r.text, at = text.toLowerCase().indexOf(lower);
      var from = at > 34 ? at - 34 : 0;
      var snip = text.slice(from, from + 110);
      if (from > 0) snip = "…" + snip;
      if (from + 110 < text.length) snip += "…";
      if (text.slice(0, r.title.length) === r.title) snip = "";
      var html = '<button class="sr-item" type="button" data-tab="' + r.tab + '" data-target="' + r.id + '">' +
        '<span class="sr-tab">' + (TABLABEL[r.tab] || r.tab) + '</span>' +
        '<span class="sr-title">' + hl(r.title, q) + '</span>' +
        (snip ? '<span class="sr-text">' + hl(snip, q) + '</span>' : '') +
        '</button>';
      return html;
    }).join('');

    panel.innerHTML = '<div class="sr-head">검색 결과 ' + results.length + '건' + (results.length > 30 ? ' · 상위 30건 표시' : '') + '</div>' +
      (results.length ? body : '<div class="sr-empty">‘' + esc(q) + '’에 해당하는 내용이 없습니다.</div>');
    panel.hidden = false;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  var selected = "";
  function currentTab(){
    var t = wrapEl.querySelector('.tab[aria-selected="true"]');
    return t ? t.getAttribute("data-tab") : selected;
  }

  function selectTab(id){
    selected = id;
    wrapEl.querySelectorAll(".tab").forEach(function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-tab") === id ? "true" : "false");
    });
    wrapEl.querySelectorAll(".panel").forEach(function(p){
      if (p.id === "panel-" + id) p.removeAttribute("hidden"); else p.setAttribute("hidden", "");
    });
    var hero = wrapEl.querySelector(".hero");
    if (hero) hero.style.display = (id === "office" || id === undefined) ? "" : "none";
    var panel = wrapEl.querySelector("#srch");
    if (panel) { panel.hidden = true; panel.innerHTML = ""; }
    var qEl = wrapEl.querySelector("#q");
    if (qEl) qEl.value = "";
    var cb = wrapEl.querySelector("#q-clear");
    if (cb) cb.hidden = true;
  }

  /* ---------------- session & lock ---------------- */
  function touch(){
    if (autoLockTimer) clearTimeout(autoLockTimer);
    autoLockTimer = setTimeout(lockNow, AUTO_LOCK_MS);
  }

  function store(){ try { return window.sessionStorage; } catch (e) { return null; } }
  function saveSession(data){ var s = store(); try { if (s) s.setItem(SKEY, JSON.stringify(data)); } catch (e) {} }
  function readSession(){ var s = store(); try { return s ? s.getItem(SKEY) : null; } catch (e) { return null; } }
  function clearSession(){ var s = store(); try { if (s) s.removeItem(SKEY); } catch (e) {} }

  function open(data){
    saveSession(data);
    render(data);
    lockEl.hidden = true;
    appEl.hidden = false;
    touch();
    ["click","keydown","touchstart","scroll"].forEach(function(e){
      window.addEventListener(e, touch, { passive: true });
    });
  }

  function lockNow(){
    clearSession();
    if (location.protocol === "file:") { location.replace(location.pathname); return; }
    location.reload();
  }

  /* ---------------- boot ---------------- */
  var saved = readSession();
  if (saved) {
    try { open(JSON.parse(saved)); } catch (e) { clearSession(); }
  }
  if (!readSession()) pwEl.focus();

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var pw = pwEl.value;
    if (!pw) { pwEl.focus(); return; }
    btn.disabled = true;
    msgEl.textContent = "";
    decrypt(pw).then(function(data){
      btn.disabled = false;
      pwEl.value = "";
      open(data);
      window.scrollTo(0, 0);
    }).catch(function(){
      btn.disabled = false;
      tries++;
      msgEl.textContent = tries >= 3 ? "비밀번호가 맞지 않습니다. 대소문자를 확인해 주세요." : "비밀번호가 맞지 않습니다.";
      document.querySelector(".lock-card").classList.add("shake");
      setTimeout(function(){ document.querySelector(".lock-card").classList.remove("shake"); }, 360);
      pwEl.select();
    });
  });
})();
</script>
</body>
</html>
