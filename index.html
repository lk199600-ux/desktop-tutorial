<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>비서실</title>
<style>
  :root{
    --bg:#f2f3f6; --card:#ffffff; --ink:#12141a; --muted:#6b7280; --faint:#9aa1ad;
    --line:#e6e8ee; --navy:#171b26; --green:#10b981; --green-soft:#e6f8f0;
    --blue:#3563e9; --blue-soft:#eef3ff; --red:#e0362f; --red-soft:#fdeeed;
    --yellow:#a86a00; --yellow-soft:#fff6e0; --gray-soft:#f3f4f7;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --radius:22px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
  }
  button{font:inherit;color:inherit}
  a{color:var(--blue);text-decoration:none}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace;font-size:.88em;background:#f1f2f6;border-radius:6px;padding:1px 5px;color:#3b4252}
  b,strong{font-weight:700}

  /* ---------- lock ---------- */
  #lock{
    min-height:100dvh; display:grid; place-items:center; padding:24px 20px;
    background:
      radial-gradient(900px 480px at 50% -8%, #ffffff 0%, rgba(255,255,255,0) 70%),
      radial-gradient(520px 320px at 110% 110%, #e6ecff 0%, rgba(230,236,255,0) 70%),
      var(--bg);
  }
  .lock-card{
    width:min(430px,100%); background:var(--card); border:1px solid var(--line);
    border-radius:30px; padding:30px 26px 26px; box-shadow:0 24px 60px rgba(16,24,40,.10);
    animation:rise .5s cubic-bezier(.2,.7,.3,1) both;
  }
  .lock-mark{
    width:66px;height:66px;border-radius:22px;background:var(--navy);color:#fff;
    display:grid;place-items:center;font-size:30px;line-height:1;
    box-shadow:0 10px 24px rgba(23,27,38,.25);margin-bottom:18px;
  }
  .lock-title{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}
  .lock-sub{margin:6px 0 22px;color:var(--muted);font-size:14px}
  .field{position:relative}
  .field input{
    width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:16px;
    background:#fafbfc;font-size:16px;letter-spacing:.08em;outline:none;transition:.18s;
  }
  .field input:focus{border-color:#c3cad8;background:#fff;box-shadow:0 0 0 4px rgba(53,99,233,.08)}
  .btn-primary{
    width:100%;margin-top:12px;padding:15px 16px;border:0;border-radius:16px;
    background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer;
    transition:transform .12s,opacity .2s;
  }
  .btn-primary:active{transform:scale(.99)}
  .btn-primary[disabled]{opacity:.6;cursor:progress}
  .lock-msg{min-height:20px;margin:12px 2px 0;font-size:13px;color:var(--red)}
  .lock-note{margin:18px 2px 0;font-size:12px;color:var(--faint);line-height:1.6}
  .shake{animation:shake .34s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- shell ---------- */
  #app[hidden], #lock[hidden]{display:none!important}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 56px}
  .topbar{display:flex;align-items:center;gap:14px;padding:6px 2px 18px}
  .mark{
    width:56px;height:56px;flex:0 0 56px;border-radius:18px;background:var(--navy);color:#fff;
    display:grid;place-items:center;font-size:26px;box-shadow:0 8px 18px rgba(23,27,38,.22)
  }
  .titles{min-width:0;flex:1}
  .titles h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titles p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live{
    display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
    background:var(--green-soft);color:#0b7a4b;font-size:12px;font-weight:800;letter-spacing:.06em;flex:0 0 auto
  }
  .live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(16,185,129,.55);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 9px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

  .tabbar{
    position:sticky;top:0;z-index:40;margin:0 -16px 18px;padding:10px 16px;
    background:rgba(242,243,246,.86);backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
  }
  .tabs{
    display:flex;gap:4px;background:#e9ebf0;border-radius:18px;padding:5px;
    overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:1 0 auto;min-width:0;border:0;background:transparent;border-radius:14px;
    padding:11px 14px;font-size:14px;font-weight:700;color:#5d6472;cursor:pointer;
    white-space:nowrap;transition:background .16s,color .16s,box-shadow .16s
  }
  .tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08),0 4px 12px rgba(16,24,40,.07)}

  /* ---------- cards & blocks ---------- */
  .panel[hidden]{display:none}
  .panel{animation:fade .32s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
  .hero{padding:22px}
  .badge{display:inline-block;padding:6px 11px;border-radius:9px;background:#eef0f4;color:#4b5262;font-size:12px;font-weight:800}
  .hero h2{margin:12px 0 6px;font-size:21px;line-height:1.35;font-weight:800;letter-spacing:-.03em}
  .hero p{margin:0;color:var(--muted);font-size:14px}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .pill{padding:9px 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:#3c4250;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .pill.solid{background:var(--navy);color:#fff;border-color:var(--navy)}

  .sec{display:flex;align-items:baseline;gap:10px;margin:26px 4px 12px;flex-wrap:wrap}
  .sec:first-child{margin-top:4px}
  .sec h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.03em}
  .sec p{margin:0;font-size:13px;color:var(--faint)}

  .parts{display:grid;grid-template-columns:1fr;gap:12px}
  .part{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);scroll-margin-top:96px}
  .part.flash{animation:flash 1.4s ease}
  @keyframes flash{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 3px rgba(53,99,233,.35),0 8px 24px rgba(53,99,233,.14)}}
  .part-head{display:flex;align-items:center;gap:11px}
  .part-emoji{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:#f4f5f8;display:grid;place-items:center;font-size:21px}
  .part-name{font-size:16px;font-weight:800;letter-spacing:-.02em}
  .part-cycle{font-size:12px;color:var(--faint)}
  .state{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--green-soft);color:#0b7a4b}
  .state i{width:6px;height:6px;border-radius:50%;background:var(--green)}
  .part-doing{margin:13px 0 0;font-size:14.5px;font-weight:700}
  .part-meta{margin:8px 0 0;font-size:13px;color:var(--muted)}
  .part-last{margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--faint)}

  .callout{border-radius:20px;padding:18px 18px 16px;margin-bottom:12px;border:1px solid transparent;box-shadow:var(--shadow)}
  .callout .co-title{display:flex;gap:10px;font-size:15px;font-weight:800;line-height:1.45;letter-spacing:-.02em}
  .callout .co-title span.ico{font-size:17px;line-height:1.4}
  .callout .co-body{margin:9px 0 0 27px;font-size:13.5px;line-height:1.62}
  .callout .co-body ul{margin:0;padding-left:16px}
  .callout .co-body li{margin:3px 0}
  .red{background:var(--red-soft);border-color:#f8d7d4;color:#8d1f19}
  .yellow{background:var(--yellow-soft);border-color:#f3e2b8;color:#7a4d00}
  .blue{background:var(--blue-soft);border-color:#dbe5ff;color:#1e3a8a}
  .gray{background:var(--gray-soft);border-color:#e4e6ec;color:#3f4552}

  .table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:460px}
  th,td{text-align:left;vertical-align:top;padding:13px 16px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--faint);font-weight:800;background:#fafbfc;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td:first-child{font-weight:700;white-space:nowrap}

  .acc{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
  .acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:16px 18px;font-size:14.5px;font-weight:800;letter-spacing:-.02em}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary:after{content:"";width:8px;height:8px;margin-left:auto;border-right:2px solid #a6adba;border-bottom:2px solid #a6adba;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
  .acc[open] summary:after{transform:rotate(-135deg) translateY(-2px)}
  .acc-body{padding:0 18px 16px;font-size:13.5px;color:#3f4552;line-height:1.68}
  .acc-body ul{margin:0;padding-left:18px}
  .acc-body li{margin:5px 0}
  .acc-body ul ul{margin:4px 0}

  .office{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:10px;position:relative;overflow:hidden}
  .office-img{display:block;width:100%;height:auto;border-radius:18px;background:#f6f7f9}
  .spot{
    position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;
    padding:7px 12px;border-radius:999px;background:rgba(22,26,36,.86);color:#fff;
    font-size:12px;font-weight:800;letter-spacing:-.01em;cursor:pointer;border:0;
    box-shadow:0 6px 16px rgba(16,24,40,.28);backdrop-filter:blur(4px);white-space:nowrap;
    transition:transform .15s,background .15s
  }
  .spot:hover{transform:translate(-50%,-50%) scale(1.06);background:#0f131c}
  .spot i{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.25)}
  .office-cap{margin:10px 6px 2px;font-size:12px;color:var(--faint)}

  .list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 18px;margin-bottom:12px}
  .list ul{margin:0;padding:0;list-style:none}
  .list li{position:relative;padding:12px 0 12px 18px;font-size:13.5px;border-bottom:1px solid var(--line);line-height:1.6}
  .list li:last-child{border-bottom:0}
  .list li:before{content:"";position:absolute;left:2px;top:20px;width:6px;height:6px;border-radius:50%;background:#c3c9d4}

  .timeline{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 18px;margin-bottom:12px}
  .tl{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .tl:last-child{border-bottom:0}
  .tl-date{flex:0 0 118px;font-size:12.5px;font-weight:800;color:#3c4250;font-variant-numeric:tabular-nums}
  .tl-text{font-size:13.5px;line-height:1.6}
  .tl-tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:#2547b8;font-size:11px;font-weight:800;vertical-align:1px}

  .checks{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 18px;margin-bottom:12px}
  .check{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;line-height:1.6}
  .check:last-child{border-bottom:0}
  .check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:0 0 22px;margin:0;border:1.5px solid #cfd5df;border-radius:7px;background:#fff;cursor:pointer;position:relative;transition:.15s}
  .check input:checked{background:var(--green);border-color:var(--green)}
  .check input:checked:after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .check input:checked + span{color:var(--faint);text-decoration:line-through}

  .links{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
  .link{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;font-size:14px;font-weight:700;color:var(--ink);
    box-shadow:var(--shadow);transition:transform .12s,border-color .15s
  }
  .link:hover{border-color:#cfd5e2}
  .link:active{transform:scale(.995)}
  .link:after{content:"↗";margin-left:auto;color:var(--faint);font-weight:400}

  .foot{margin:26px 2px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
  .foot .spacer{flex:1}
  .btn-ghost{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:700;color:#4b5262;cursor:pointer}
  .dot{width:4px;height:4px;border-radius:50%;background:#c3c9d4}

  @media (min-width:720px){
    .wrap{padding:30px 24px 64px}
    .mark{width:62px;height:62px;flex-basis:62px;border-radius:20px;font-size:29px}
    .titles h1{font-size:26px}
    .tabbar{margin:0 -24px 22px;padding:12px 24px}
    .tab{padding:12px 18px;font-size:14.5px}
    .parts{grid-template-columns:repeat(2,1fr)}
    .links{grid-template-columns:repeat(2,1fr)}
    .hero h2{font-size:24px}
    .card{padding:24px}
    .part{padding:20px}
  }
  @media (min-width:1000px){
    .parts{grid-template-columns:repeat(4,1fr)}
    .hero h2{font-size:26px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<!-- ============ LOCK ============ -->
<section id="lock">
  <form class="lock-card" id="lock-form" autocomplete="off">
    <div class="lock-mark" aria-hidden="true">🏢</div>
    <h1 class="lock-title">비서실</h1>
    <p class="lock-sub">비밀번호를 입력하면 열립니다.</p>
    <div class="field">
      <input id="pw" type="password" inputmode="text" enterkeyhint="go" placeholder="비밀번호" aria-label="비밀번호" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <button class="btn-primary" id="unlock-btn" type="submit">열기</button>
    <p class="lock-message lock-msg" id="msg" role="status" aria-live="polite"></p>
    <p class="lock-note">내용은 이 기기에서만 복호화됩니다. 비밀번호는 어디에도 저장되지 않으며, 잠시 열어둔 화면은 일정 시간 뒤 자동으로 잠깁니다.</p>
  </form>
</section>

<!-- ============ APP ============ -->
<main id="app" hidden>
  <div class="wrap" id="wrap"></div>

<script>
(function(){
  "use strict";
  var SKEY = "office-unlocked-v1";
  var AUTO_LOCK_MS = 30 * 60 * 1000;
  var payload = JSON.parse(document.getElementById("payload").textContent);
  var lockEl = document.getElementById("lock");
  var appEl = document.getElementById("app");
  var wrapEl = document.getElementById("wrap");
  var form = document.getElementById("lock-form");
  var pwEl = document.getElementById("pw");
  var msgEl = document.getElementById("msg");
  var btn = document.getElementById("unlock-btn");
  var tries = 0, autoLockTimer = null;

  function b64(s){
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function deriveKey(password){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(payload.salt), iterations: payload.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      });
  }
  function decrypt(password){
    return deriveKey(password).then(function(key){
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(payload.iv) }, key, b64(payload.ct));
    }).then(function(buf){
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }

  /* ---------------- render ---------------- */
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function blockHTML(b){
    switch (b.type) {
      case "section":
        return '<div class="sec"><h2>' + b.title + '</h2>' + (b.desc ? '<p>' + b.desc + '</p>' : '') + '</div>';
      case "parts":
        return '<div class="parts">' + b.items.map(function(p, i){
          return '<article class="part" id="part-' + i + '">' +
            '<div class="part-head">' +
              '<div class="part-emoji">' + p.emoji + '</div>' +
              '<div><div class="part-name">' + p.name + '</div><div class="part-cycle">' + p.cycle + '</div></div>' +
              '<span class="state"><i></i>' + p.state + '</span>' +
            '</div>' +
            '<p class="part-doing">' + p.doing + '</p>' +
            '<p class="part-meta">' + p.scope + '</p>' +
            '<p class="part-last">' + p.last + '</p>' +
          '</article>';
        }).join('') + '</div>';
      case "table":
        return '<div class="table-wrap"><table><thead><tr>' +
          b.head.map(function(h){ return '<th>' + h + '</th>'; }).join('') +
          '</tr></thead><tbody>' + b.rows.map(function(r){
            return '<tr>' + r.map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>';
      case "accordion":
        return b.items.map(function(it){
          return '<details class="acc"' + (b.open ? ' open' : '') + '><summary>' + it.title + '</summary><div class="acc-body">' + it.html + '</div></details>';
        }).join('');
      case "office_map":
        return '<div class="office"><img class="office-img" src="' + b.image + '" alt="비서실 오피스" loading="lazy" width="1536" height="1024">' +
          b.spots.map(function(s){
            var act = (s.part !== undefined) ? ' data-part="' + s.part + '"' : ' data-goto="' + s.tab + '"';
            return '<button class="spot" style="left:' + s.x + '%;top:' + s.y + '%"' + act + ' type="button">' +
              '<i></i>' + (s.emoji ? s.emoji + ' ' : '') + s.label + '</button>';
          }).join('') + '</div>' + (b.caption ? '<p class="office-cap">' + b.caption + '</p>' : '');
      case "callout":
        return '<div class="callout ' + (b.tone || "gray") + '"><div class="co-title"><span class="ico">' + b.icon + '</span><span>' + b.title + '</span></div><div class="co-body">' + b.html + '</div></div>';
      case "list":
        return '<div class="list"><ul>' + b.items.map(function(t){ return '<li>' + t + '</li>'; }).join('') + '</ul></div>';
      case "links":
        return '<div class="links">' + b.items.map(function(l){
          return '<a class="link" href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer">' + l.label + '</a>';
        }).join('') + '</div>';
      case "timeline":
        return '<div class="timeline">' + b.items.map(function(t){
          return '<div class="tl"><div class="tl-date">' + t.date + '</div><div class="tl-text">' + t.text +
            (t.tag ? '<span class="tl-tag">' + t.tag + '</span>' : '') + '</div></div>';
        }).join('') + '</div>';
      case "checklist":
        return '<div class="checks">' + b.items.map(function(t, i){
          var id = "ck-" + i;
          return '<label class="check" for="' + id + '"><input type="checkbox" id="' + id + '"><span>' + t + '</span></label>';
        }).join('') + '</div>';
      default:
        return '';
    }
  }

  function render(data){
    var h = data.head;
    var html = '<header class="topbar">' +
      '<div class="mark" aria-hidden="true">' + h.mark + '</div>' +
      '<div class="titles"><h1>' + h.title + '</h1><p>' + h.subtitle + '</p></div>' +
      '<span class="live"><i></i>' + h.live + '</span>' +
      '</header>';

    html += '<div class="tabbar"><div class="tabs" role="tablist">' +
      data.tabs.map(function(t, i){
        return '<button class="tab" role="tab" data-tab="' + t.id + '" aria-selected="' + (i === 0 ? "true" : "false") + '" type="button">' + t.label + '</button>';
      }).join('') + '</div></div>';

    html += '<section class="card hero"><span class="badge">' + h.heroBadge + '</span>' +
      '<h2>' + h.heroTitle + '</h2><p>' + h.heroDesc + '</p>' +
      '<div class="pills">' + h.pills.map(function(p, i){ return '<span class="pill' + (i === 0 ? ' solid' : '') + '">' + p + '</span>'; }).join('') + '</div>' +
      '</section>';

    data.tabs.forEach(function(t, i){
      html += '<div class="panel" id="panel-' + t.id + '" role="tabpanel"' + (i === 0 ? '' : ' hidden') + '>' +
        t.blocks.map(blockHTML).join('') + '</div>';
    });

    html += '<footer class="foot"><span>' + (data.meta ? data.meta.source + ' · ' + data.meta.generated + ' 기준' : '') + '</span>' +
      '<span class="dot"></span><span>잠금은 이 기기에서만 해제됩니다.</span>' +
      '<span class="spacer"></span><button class="btn-ghost" id="lock-btn" type="button">🔒 잠그기</button></footer>';

    wrapEl.innerHTML = html;

    var tabs = wrapEl.querySelectorAll(".tab");
    tabs.forEach(function(btnEl){
      btnEl.addEventListener("click", function(){ selectTab(btnEl.getAttribute("data-tab")); });
    });

    wrapEl.addEventListener("click", function(ev){
      var spot = ev.target.closest(".spot");
      if (spot) {
        if (spot.dataset.part !== undefined) {
          var card = wrapEl.querySelector("#part-" + spot.dataset.part);
          if (card) {
            card.scrollIntoView({ behavior: "smooth", block: "center" });
            card.classList.remove("flash");
            void card.offsetWidth;
            card.classList.add("flash");
          }
        } else if (spot.dataset.goto) {
          selectTab(spot.dataset.goto);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }
      var lockBtn = ev.target.closest("#lock-btn");
      if (lockBtn) lockNow();
    });

    wrapEl.querySelectorAll(".checks input").forEach(function(cb){
      cb.addEventListener("change", touch);
    });
  }

  function selectTab(id){
    wrapEl.querySelectorAll(".tab").forEach(function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-tab") === id ? "true" : "false");
    });
    wrapEl.querySelectorAll(".panel").forEach(function(p){
      if (p.id === "panel-" + id) p.removeAttribute("hidden"); else p.setAttribute("hidden", "");
    });
    // reset hero visibility: hero only meant for office tab
    var hero = wrapEl.querySelector(".hero");
    if (hero) hero.style.display = (id === "office") ? "" : "none";
  }

  function touch(){
    if (autoLockTimer) clearTimeout(autoLockTimer);
    autoLockTimer = setTimeout(lockNow, AUTO_LOCK_MS);
  }

  function open(data){
    sessionStorage.setItem(SKEY, JSON.stringify(data));
    render(data);
    lockEl.hidden = true;
    appEl.hidden = false;
    touch();
    ["click","keydown","touchstart","scroll"].forEach(function(e){
      window.addEventListener(e, touch, { passive: true });
    });
  }

  function lockNow(){
    sessionStorage.removeItem(SKEY);
    location.reload();
  }

  /* ---------------- boot ---------------- */
  var saved = sessionStorage.getItem(SKEY);
  if (saved) {
    try { open(JSON.parse(saved)); } catch (e) { sessionStorage.removeItem(SKEY); }
  }
  if (!sessionStorage.getItem(SKEY)) pwEl.focus();

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var pw = pwEl.value;
    if (!pw) { pwEl.focus(); return; }
    btn.disabled = true;
    msgEl.textContent = "";
    decrypt(pw).then(function(data){
      btn.disabled = false;
      pwEl.value = "";
      open(data);
      window.scrollTo(0, 0);
    }).catch(function(){
      btn.disabled = false;
      tries++;
      msgEl.textContent = tries >= 3 ? "비밀번호가 맞지 않습니다. 대소문자를 확인해 주세요." : "비밀번호가 맞지 않습니다.";
      document.querySelector(".lock-card").classList.add("shake");
      setTimeout(function(){ document.querySelector(".lock-card").classList.remove("shake"); }, 360);
      pwEl.select();
    });
  });
})();
</script>
</body>
</html>
